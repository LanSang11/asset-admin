# 资产系统 HTTPS 入口（与博客 example.com 分站点，SNI 共用 443）
# 安装：复制到 /etc/nginx/conf.d/asset.example.com.conf
# 先有证书再 reload。博客 vhost 不要改。

server {
    listen 80;
    server_name asset.example.com;

    root /var/www/asset-system/web/dist;
    index index.html;

    location ^~ /.well-known/ {
        alias /var/www/asset-system/acme/.well-known/;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name asset.example.com;

    ssl_certificate     /etc/letsencrypt/live/asset.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asset.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/asset-system/web/dist;
    index index.html;

    location ^~ /.well-known/ {
        alias /var/www/asset-system/acme/.well-known/;
        default_type text/plain;
        allow all;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
