# 资产系统公网入口：与博客 80/443 隔离
# 安装示例（宝塔/系统 Nginx）：
#   复制到 /etc/nginx/conf.d/asset-system-9999.conf
#   或 include 进主配置后 nginx -t && nginx -s reload
#
# 路径按实际上传目录修改 root / proxy_pass

server {
    listen 9999;
    server_name _;

    # 基础安全头（仅本 vhost :9999，不动博客 80/443）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端静态（本机构建的 web/dist）
    root /var/www/asset-system/web/dist;
    index index.html;

    # 显式静态壳：避免个别环境下 /index.html 误进反代导致 502
    location = /index.html {
        root /var/www/asset-system/web/dist;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA：物理文件优先；否则回落 index.html（/login 等前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API → 本机 uvicorn（勿改成公网直暴露 8000，除非你清楚风险）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
