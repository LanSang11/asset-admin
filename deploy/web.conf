server {
        listen 80;
        server_name localhost;

        # SPA 入口：禁止缓存，保证每次都能拿到最新 index.html（引用最新构建资源）
        location = /index.html {
              root /opt/asset-management-system/web/dist;
              add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # 带内容 hash 的构建产物：可长缓存（文件名变化即缓存失效）
        location ^~ /assets/ {
              root /opt/asset-management-system/web/dist;
              add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # public 目录非 hash 资源（favicon.svg/loading.js/loading.css）：由 index.html 的 ?v= 版本号控制
        location ~* \.(svg|js|css)$ {
              root /opt/asset-management-system/web/dist;
              add_header Cache-Control "no-cache";
        }

        location / {
              root /opt/asset-management-system/web/dist;
              index index.html index.htm;
              try_files $uri /index.html;
        }

        location ^~ /api/ {
                proxy_pass http://127.0.0.1:9999;
                # 修复：透传真实客户端 IP（配合 uvicorn proxy_headers）。
                # 单层反代直接用 $remote_addr 覆盖（不用 $proxy_add_x_forwarded_for——
                # 它会拼接客户端伪造的 XFF 首段，starlette 取第一个 IP 可被伪造绕过限流/冒名拉黑）
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header Forwarded "";
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Host $host;
        }
}
