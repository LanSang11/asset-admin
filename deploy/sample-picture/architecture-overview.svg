  <text class="font card-sub" x="1155" y="762" text-anchor="middle">限流 · 黑名单 · 安全头</text>
  <text class="font card-sub" x="1155" y="786" text-anchor="middle">可信代理与客户端 IP</text>
  <rect x="1295" y="697" width="225" height="112" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
