  <text class="font card-title" x="1172" y="1231" text-anchor="middle">可选模型 API</text>
  <text class="font card-sub" x="1172" y="1257" text-anchor="middle">运行时自行配置</text>
  <rect x="1315" y="1196" width="205" height="86" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
