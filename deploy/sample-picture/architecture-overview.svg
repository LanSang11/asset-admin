  <line x1="800" y1="1145" x2="800" y2="1167" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Layer 6 -->
  <g filter="url(#shadow)">
    <rect x="40" y="1170" width="1520" height="138" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="40" y="1170" width="184" height="138" rx="24" fill="#334155"/>
