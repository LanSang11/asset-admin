  <rect x="255" y="1058" width="238" height="58" rx="15" fill="#fffaf0" stroke="#fdba74"/>
  <text class="font card-title" x="374" y="1094" text-anchor="middle">知识库与 RAG 检索</text>
  <rect x="509" y="1058" width="238" height="58" rx="15" fill="#fffaf0" stroke="#fdba74"/>
  <text class="font card-title" x="628" y="1094" text-anchor="middle">可选 AI 服务适配</text>
  <rect x="763" y="1058" width="238" height="58" rx="15" fill="#fffaf0" stroke="#fdba74"/>
  <text class="font card-title" x="882" y="1094" text-anchor="middle">通知与质保提醒</text>
