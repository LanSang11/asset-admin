  <rect x="520" y="1196" width="245" height="86" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="font card-title" x="642" y="1231" text-anchor="middle">RAG Store</text>
  <text class="font card-sub" x="642" y="1257" text-anchor="middle">独立知识库 SQLite</text>
  <rect x="785" y="1196" width="245" height="86" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="font card-title" x="907" y="1231" text-anchor="middle">本地文件目录</text>
