  <text class="font" x="124" y="372" font-size="23" font-weight="800" fill="#ffffff">前端层</text>
  <text class="font" x="124" y="399" font-size="13" font-weight="700" fill="#a7f3d0">FRONTEND</text>
  <rect x="255" y="353" width="230" height="88" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text class="font card-title" x="370" y="390" text-anchor="middle">Vue 3 + Vite</text>
  <text class="font card-sub" x="370" y="417" text-anchor="middle">页面构建与开发工具链</text>
  <rect x="505" y="353" width="230" height="88" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text class="font card-title" x="620" y="390" text-anchor="middle">Vue Router</text>
  <text class="font card-sub" x="620" y="417" text-anchor="middle">路由与角色入口</text>
