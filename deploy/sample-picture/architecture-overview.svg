<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title desc">
  <title id="title">资产管理系统可扩展六层架构图</title>
  <desc id="desc">从使用者、前端、接口、安全、业务服务到数据与外部集成的六层架构。第五层业务模块可继续扩展。</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="titleBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="businessBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fffbeb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .layer-title { font-size: 25px; font-weight: 800; fill: #0f172a; }
      .layer-en { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
      .card-title { font-size: 19px; font-weight: 750; fill: #172033; }
      .card-sub { font-size: 14px; font-weight: 500; fill: #64748b; }
      .number { font-size: 24px; font-weight: 850; fill: #ffffff; }
      .tag { font-size: 14px; font-weight: 750; fill: #ffffff; }
      .note { font-size: 15px; font-weight: 650; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="1340" fill="url(#pageBg)"/>
  <rect x="40" y="34" width="1520" height="112" rx="28" fill="url(#titleBg)" filter="url(#shadow)"/>
  <text class="font" x="80" y="83" font-size="32" font-weight="850" fill="#ffffff">资产管理系统 · 可扩展六层架构</text>
  <text class="font" x="80" y="119" font-size="17" font-weight="550" fill="#c7d2fe">Stable layers, extensible business modules · 新功能通常扩展业务层，不改变整体骨架</text>
  <rect x="1250" y="65" width="126" height="42" rx="21" fill="#0369a1"/>
  <text class="font tag" x="1313" y="91" text-anchor="middle">稳定框架</text>
  <rect x="1390" y="65" width="130" height="42" rx="21" fill="#ea580c"/>
  <text class="font tag" x="1455" y="91" text-anchor="middle">可扩展区</text>

  <!-- Layer 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="170" width="1520" height="126" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="40" y="170" width="184" height="126" rx="24" fill="#2563eb"/>
    <rect x="196" y="170" width="28" height="126" fill="#2563eb"/>
  </g>
  <circle cx="86" cy="214" r="25" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
  <text class="font number" x="86" y="222" text-anchor="middle">01</text>
  <text class="font" x="124" y="211" font-size="23" font-weight="800" fill="#ffffff">使用者</text>
  <text class="font" x="124" y="238" font-size="13" font-weight="700" fill="#bfdbfe">USERS</text>
  <rect x="255" y="193" width="245" height="80" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="font card-title" x="377" y="227" text-anchor="middle">超级管理员 / 管理员</text>
  <text class="font card-sub" x="377" y="253" text-anchor="middle">全局管理、终审与安全运营</text>
  <rect x="520" y="193" width="245" height="80" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="font card-title" x="642" y="227" text-anchor="middle">部门主管</text>
  <text class="font card-sub" x="642" y="253" text-anchor="middle">部门数据与一级审批</text>
  <rect x="785" y="193" width="245" height="80" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="font card-title" x="907" y="227" text-anchor="middle">普通员工</text>
  <text class="font card-sub" x="907" y="253" text-anchor="middle">本人资产与业务申请</text>
  <rect x="1050" y="193" width="470" height="80" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="font card-title" x="1285" y="227" text-anchor="middle">浏览器 / 手机扫码入口</text>
  <text class="font card-sub" x="1285" y="253" text-anchor="middle">响应式页面 · 登录后按角色读取</text>

  <line x1="800" y1="301" x2="800" y2="323" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Layer 2 -->
  <g filter="url(#shadow)">
    <rect x="40" y="326" width="1520" height="142" rx="24" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="40" y="326" width="184" height="142" rx="24" fill="#059669"/>
    <rect x="196" y="326" width="28" height="142" fill="#059669"/>
  </g>
  <circle cx="86" cy="375" r="25" fill="#047857" stroke="#6ee7b7" stroke-width="2"/>
