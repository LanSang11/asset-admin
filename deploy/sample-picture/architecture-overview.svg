  <text class="font card-sub" x="635" y="762" text-anchor="middle">角色 · 菜单 · API 权限</text>
  <text class="font card-sub" x="635" y="786" text-anchor="middle">部门与本人数据范围</text>
  <rect x="775" y="697" width="240" height="112" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text class="font card-title" x="895" y="735" text-anchor="middle">高风险操作</text>
  <text class="font card-sub" x="895" y="762" text-anchor="middle">TOTP · Step-up Token</text>
  <text class="font card-sub" x="895" y="786" text-anchor="middle">按操作绑定且一次性使用</text>
  <rect x="1035" y="697" width="240" height="112" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
