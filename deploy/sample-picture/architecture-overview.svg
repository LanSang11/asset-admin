  <text class="font card-title" x="870" y="390" text-anchor="middle">Pinia</text>
  <text class="font card-sub" x="870" y="417" text-anchor="middle">登录、权限与页面状态</text>
  <rect x="1005" y="353" width="230" height="88" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text class="font card-title" x="1120" y="390" text-anchor="middle">Naive UI</text>
  <text class="font card-sub" x="1120" y="417" text-anchor="middle">表单、表格与反馈组件</text>
  <rect x="1255" y="353" width="265" height="88" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text class="font card-title" x="1387" y="390" text-anchor="middle">Axios + API 封装</text>
  <text class="font card-sub" x="1387" y="417" text-anchor="middle">统一请求、令牌与错误处理</text>

  <line x1="800" y1="473" x2="800" y2="495" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

