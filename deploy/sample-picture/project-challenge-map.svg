<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">从能跑到可交付：42 份真实问题记录沉淀出的工程能力</title>
  <desc id="desc">四阶段演进、六类代表性困难与七步排错闭环。以本轮开始前 42 份历史记录为基础，本轮新增 3 份修复记录，当前共 45 篇。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2f"/>
      <stop offset="0.52" stop-color="#0b2742"/>
      <stop offset="1" stop-color="#061422"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28c2ff"/>
      <stop offset="1" stop-color="#54e2c2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a5a" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0b263e" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000b14" flood-opacity="0.5"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .muted { fill: #9ab6ca; }
      .small { font-size: 19px; }
      .body { font-size: 22px; fill: #d9edf9; }
      .card-title { font-size: 27px; font-weight: 700; fill: #ffffff; }
      .stage-title { font-size: 24px; font-weight: 700; fill: #061827; }
      .stage-sub { font-size: 18px; fill: #0a3145; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <circle cx="1370" cy="120" r="260" fill="#0c84bc" opacity="0.09"/>
  <circle cx="170" cy="975" r="300" fill="#16cba1" opacity="0.06"/>
  <path d="M0 80 C300 10 520 150 820 72 S1320 20 1600 95" fill="none" stroke="#46cfff" stroke-opacity="0.12" stroke-width="2"/>

  <text x="80" y="84" font-size="46" font-weight="800" fill="#ffffff">从能跑到可交付</text>
  <text x="80" y="128" font-size="27" fill="#79dfff">42 份真实问题记录沉淀出的工程能力</text>
  <text x="80" y="160" font-size="19" class="muted">不是把流水账写长，而是用“现象—根因—修正—验证—复盘”证明持续交付。</text>

  <g transform="translate(1040 52)">
    <rect width="470" height="112" rx="22" fill="#0e314d" stroke="#2f6c8f"/>
    <text x="28" y="38" font-size="18" class="muted">本轮开始前的历史记录</text>
    <text x="28" y="83" font-size="36" font-weight="800" fill="#ffffff">42</text>
    <text x="104" y="82" font-size="19" fill="#61d8ff">32 已修 · 6 发现 · 4 复盘</text>
    <rect x="322" y="22" width="122" height="68" rx="18" fill="#143e3d" stroke="#44d5ac"/>
    <text x="383" y="50" text-anchor="middle" font-size="17" fill="#93f3d5">本轮 +3</text>
    <text x="383" y="76" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">当前 45</text>
  </g>

  <text x="80" y="215" font-size="23" font-weight="700" fill="#ccecff">四阶段能力演进</text>
  <rect x="80" y="235" width="1430" height="120" rx="28" fill="#0a2239" stroke="#235272"/>
  <path d="M218 295 H1375" stroke="url(#rail)" stroke-width="8" stroke-linecap="round"/>

  <g transform="translate(105 254)">
    <rect width="280" height="82" rx="20" fill="#45cfff" filter="url(#shadow)"/>
    <text x="24" y="34" class="stage-title">阶段 1 · 项目骨架</text>
    <text x="24" y="62" class="stage-sub">Python / Web / 数据模型 / 安全基线</text>
  </g>
  <g transform="translate(470 254)">
    <rect width="280" height="82" rx="20" fill="#45d8e9" filter="url(#shadow)"/>
    <text x="24" y="34" class="stage-title">阶段 2 · 接口规范</text>
    <text x="24" y="62" class="stage-sub">CRUD / 分页 / 筛选 / 导入导出</text>
  </g>
  <g transform="translate(835 254)">
    <rect width="280" height="82" rx="20" fill="#4bdfce" filter="url(#shadow)"/>
    <text x="24" y="34" class="stage-title">阶段 3 · 权限与业务</text>
    <text x="24" y="62" class="stage-sub">角色 / 行级隔离 / 审批 / 测试</text>
  </g>
  <g transform="translate(1200 254)">
    <rect width="280" height="82" rx="20" fill="#62e7b9" filter="url(#shadow)"/>
    <text x="24" y="34" class="stage-title">阶段 4 · 生产交付</text>
    <text x="24" y="62" class="stage-sub">AI / RAG / 部署 / 备份 / 回归</text>
  </g>

  <g transform="translate(80 390)">
    <rect width="455" height="205" rx="24" fill="url(#card)" stroke="#2c87b4" filter="url(#shadow)"/>
    <circle cx="48" cy="48" r="23" fill="#ff9d3d"/><text x="48" y="56" text-anchor="middle" font-size="23" font-weight="800" fill="#10253a">1</text>
    <text x="86" y="57" class="card-title">前后端契约</text>
    <text x="30" y="102" class="body">• 7 个业务页筛选项写了却不显示</text>
    <text x="30" y="137" class="body">• 列表筛选与 CSV 导出条件分叉</text>
    <text x="30" y="177" class="small" fill="#61e2bd">结果：命名插槽 + 共享查询助手 + 契约测试</text>
  </g>

  <g transform="translate(572 390)">
    <rect width="455" height="205" rx="24" fill="url(#card)" stroke="#2c87b4" filter="url(#shadow)"/>
    <circle cx="48" cy="48" r="23" fill="#ff9d3d"/><text x="48" y="56" text-anchor="middle" font-size="23" font-weight="800" fill="#10253a">2</text>
    <text x="86" y="57" class="card-title">状态机与事务</text>
    <text x="30" y="102" class="body">• 审批状态、资产状态、历史记录不同步</text>
    <text x="30" y="137" class="body">• 闲置资产送修字段语义不一致</text>
    <text x="30" y="177" class="small" fill="#61e2bd">结果：原子事务 + 状态常量 + 业务断言</text>
  </g>

  <g transform="translate(1064 390)">
    <rect width="455" height="205" rx="24" fill="url(#card)" stroke="#2c87b4" filter="url(#shadow)"/>
    <circle cx="48" cy="48" r="23" fill="#ff9d3d"/><text x="48" y="56" text-anchor="middle" font-size="23" font-weight="800" fill="#10253a">3</text>
    <text x="86" y="57" class="card-title">权限与隔离</text>
    <text x="30" y="102" class="body">• 路由前缀冲突，员工落入管理端空壳</text>
    <text x="30" y="137" class="body">• 只有菜单隐藏，数据行仍可能越界</text>
    <text x="30" y="177" class="small" fill="#61e2bd">结果：入口分流 + 行级缩圈 + 字段脱敏</text>
  </g>

  <g transform="translate(80 625)">
    <rect width="455" height="205" rx="24" fill="url(#card)" stroke="#2c87b4" filter="url(#shadow)"/>
    <circle cx="48" cy="48" r="23" fill="#ff9d3d"/><text x="48" y="56" text-anchor="middle" font-size="23" font-weight="800" fill="#10253a">4</text>
    <text x="86" y="57" class="card-title">安全与凭据</text>
    <text x="30" y="102" class="body">• 强制改密触发 500 与敏感字段暴露</text>
    <text x="30" y="137" class="body">• 二次验证、自锁与单次令牌并发问题</text>
    <text x="30" y="177" class="small" fill="#61e2bd">结果：最小返回 + Step-up 绑定 + 审计闭环</text>
  </g>

  <g transform="translate(572 625)">
    <rect width="455" height="205" rx="24" fill="url(#card)" stroke="#2c87b4" filter="url(#shadow)"/>
    <circle cx="48" cy="48" r="23" fill="#ff9d3d"/><text x="48" y="56" text-anchor="middle" font-size="23" font-weight="800" fill="#10253a">5</text>
    <text x="86" y="57" class="card-title">AI / RAG</text>
    <text x="30" y="102" class="body">• embedding 失败后静默生成“假向量”</text>
    <text x="30" y="137" class="body">• 机密扫描误拦正常教学语料</text>
    <text x="30" y="177" class="small" fill="#61e2bd">结果：显式降级 + 引用证据 + 可解释错误</text>
  </g>

  <g transform="translate(1064 625)">
    <rect width="455" height="205" rx="24" fill="url(#card)" stroke="#2c87b4" filter="url(#shadow)"/>
    <circle cx="48" cy="48" r="23" fill="#ff9d3d"/><text x="48" y="56" text-anchor="middle" font-size="23" font-weight="800" fill="#10253a">6</text>
    <text x="86" y="57" class="card-title">部署与运维</text>
    <text x="30" y="102" class="body">• SQLite 迁移异常造成启动失败</text>
    <text x="30" y="137" class="body">• 探针误封出口、备份脚本无执行权</text>
    <text x="30" y="177" class="small" fill="#61e2bd">结果：code-only 发布 + 快照 + 健康回归</text>
  </g>

  <text x="80" y="885" font-size="23" font-weight="700" fill="#ccecff">一套可以重复使用的排错闭环</text>
  <g transform="translate(80 910)">
    <rect width="1439" height="104" rx="28" fill="#0d2b45" stroke="#2e6686"/>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <g transform="translate(105 52)"><circle r="31" fill="#ff9d3d"/><text y="7" fill="#10253a">现象</text></g>
      <text x="205" y="60" fill="#56cffa">→</text>
      <g transform="translate(305 52)"><circle r="31" fill="#1da7d9"/><text y="7" fill="#ffffff">证据</text></g>
      <text x="405" y="60" fill="#56cffa">→</text>
      <g transform="translate(505 52)"><circle r="31" fill="#1da7d9"/><text y="7" fill="#ffffff">根因</text></g>
      <text x="605" y="60" fill="#56cffa">→</text>
      <g transform="translate(705 52)"><circle r="31" fill="#1da7d9"/><text y="7" fill="#ffffff">小改</text></g>
      <text x="805" y="60" fill="#56cffa">→</text>
      <g transform="translate(905 52)"><circle r="31" fill="#31c59f"/><text y="7" fill="#082d27">测试</text></g>
      <text x="1005" y="60" fill="#56cffa">→</text>
      <g transform="translate(1105 52)"><circle r="31" fill="#31c59f"/><text y="7" fill="#082d27">云验</text></g>
      <text x="1205" y="60" fill="#56cffa">→</text>
      <g transform="translate(1305 52)"><circle r="31" fill="#31c59f"/><text y="7" fill="#082d27">复盘</text></g>
    </g>
  </g>

  <text x="80" y="1060" font-size="18" class="muted">正文精讲 12 个代表案例，附录汇总本轮开始前 42 份脱敏历史记录；本轮实施继续新增 3 份修复记录。</text>
  <text x="1518" y="1060" text-anchor="end" font-size="18" fill="#65daba">真实问题 · 最小修正 · 自动验证 · 持续沉淀</text>
</svg>
